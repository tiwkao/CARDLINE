<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบสร้างการ์ดข้อมูล</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body{font-family:Arial,sans-serif}.field{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:white}
.btn{background:#172554;color:white;padding:10px 16px;border-radius:9px;font-weight:bold}.btn2{background:#e2e8f0;padding:10px 16px;border-radius:9px;font-weight:bold}
.label{font-size:14px;font-weight:bold;display:block;margin:8px 0 5px}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<header class="bg-slate-900 text-white p-4"><div class="max-w-6xl mx-auto flex justify-between"><b>ระบบสร้างการ์ดข้อมูล</b><button onclick="showAdmin()" class="underline text-sm">Admin</button></div></header>
<main class="max-w-6xl mx-auto p-4 grid md:grid-cols-2 gap-4">
<section class="bg-white rounded-xl shadow p-4">
<h2 class="font-bold text-xl mb-3">กรอกข้อมูล</h2>
<label class="label">รูปภาพ</label><input id="photo" type="file" accept="image/*" class="field">
<label class="label">เลขประจำตัว</label><input id="personId" class="field">
<label class="label">ชื่อ-นามสกุล</label><input id="name" class="field">
<label class="label">อายุ</label><input id="age" type="number" class="field">
<div id="dynamic"></div>
<div class="flex flex-wrap gap-2 mt-4">
<button class="btn" onclick="saveCard()">บันทึกการ์ด</button>
<button class="btn2" onclick="pushLine()">ส่ง LINE</button>
<button class="btn2" onclick="shareLine()">แชร์ LINE</button>
</div><p id="status" class="text-sm mt-3"></p>
</section>
<section class="bg-white rounded-xl shadow p-4">
<h2 class="font-bold text-xl mb-3">ตัวอย่างการ์ด</h2>
<div class="bg-white border p-4 min-h-80">
<div class="text-center"><img id="previewPhoto" class="hidden w-36 h-44 object-cover border-4 border-red-600 mx-auto mb-2">
<div id="placeholder" class="w-36 h-44 bg-slate-100 border-4 border-red-600 mx-auto grid place-items-center">รูปภาพ</div>
<div id="pId" class="font-bold bg-yellow-200 table mx-auto px-2">เลขประจำตัว</div>
<div id="pName" class="font-bold bg-yellow-200 table mx-auto px-2 mt-1">ชื่อ-นามสกุล</div></div>
<div id="previewRows" class="mt-4 space-y-2 text-sm"></div>
</div>
<h3 class="font-bold mt-5 mb-2">การ์ดล่าสุด</h3><div id="recent" class="text-sm"></div>
</section>
</main>

<div id="adminPanel" class="hidden fixed inset-0 bg-black/50 overflow-auto p-4">
<div class="bg-white rounded-xl p-5 max-w-xl mx-auto mt-8">
<div class="flex justify-between"><h2 class="font-bold text-xl">จัดการระบบ Admin</h2><button onclick="hideAdmin()">ปิด ✕</button></div>
<label class="label">รหัส Admin</label><input id="adminPassword" type="password" class="field" placeholder="รหัสที่ตั้งใน Script Properties">
<hr class="my-4"><h3 class="font-bold">เพิ่มฟิลด์การ์ด</h3>
<label class="label">ชื่อฟิลด์</label><input id="newLabel" class="field" placeholder="เช่น ที่อยู่">
<label class="label">ไอคอน</label><input id="newIcon" class="field" placeholder="🏠">
<label class="label">ประเภท</label><select id="newType" class="field"><option value="text">ข้อความสั้น</option><option value="textarea">ข้อความยาว</option><option value="url">URL</option><option value="tel">โทรศัพท์</option><option value="date">วันที่</option></select>
<button onclick="addField()" class="btn mt-3">เพิ่มฟิลด์</button><div id="fieldList" class="my-3 space-y-2"></div>
<button onclick="saveFields()" class="btn">บันทึกฟิลด์</button>
<hr class="my-4"><h3 class="font-bold">ตั้งค่า LINE</h3>
<label class="label">LINE User ID / Group ID</label><input id="target" class="field">
<label class="label">LIFF ID</label><input id="liff" class="field">
<button onclick="saveSettings()" class="btn mt-3">บันทึกการตั้งค่า</button>
<p id="adminStatus" class="text-sm mt-3"></p>
</div></div>

<script>
// ====== แก้ 2 ค่านี้หลัง Deploy GAS ======
const API_URL='https://script.google.com/macros/s/AKfycbxt9PMxLq-5o9wGNwxmRa-fqb4Hs9aEIyFHqPvAgxQdIxUot_2WH2EEG1a1Hdm-jnE8/exec';
const LIFF_ID='2012410474-TexqX7iR'; // ใช้สำหรับแชร์ใน LINE
let defs=[],lastId='',lastCard=null,imageUrl='';

async function apiGet(action,extra={}) {
 const q=new URLSearchParams({action,...extra});
 const r=await fetch(API_URL+'?'+q.toString());return await r.json();
}
async function apiPost(data) {
 const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
 return await r.json();
}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function init(){
 try{const r=await apiGet('getFields');defs=r.fields||[];drawFields();loadRecent();}
 catch(e){status('เชื่อมต่อไม่ได้ ตรวจสอบ API_URL และ Deploy GAS');}
}
function drawFields(){
 document.getElementById('dynamic').innerHTML=defs.map(f=>`<label class="label">${safe(f.icon)} ${safe(f.label)}</label>${f.type==='textarea'?`<textarea class="field dyn" data-key="${safe(f.key)}"></textarea>`:`<input class="field dyn" data-key="${safe(f.key)}" type="${['url','tel','date'].includes(f.type)?f.type:'text'}">`}`).join('');
 document.querySelectorAll('.dyn').forEach(x=>x.addEventListener('input',preview));
 preview();
}
function values(){let o={};document.querySelectorAll('.dyn').forEach(x=>o[x.dataset.key]=x.value.trim());return o;}
function preview(){
 const id=document.getElementById('personId').value,name=document.getElementById('name').value,age=document.getElementById('age').value;
 document.getElementById('pId').textContent=id||'เลขประจำตัว';
 document.getElementById('pName').textContent=(name||'ชื่อ-นามสกุล')+(age?' '+age+' ปี':'');
 document.getElementById('previewRows').innerHTML=defs.filter(f=>values()[f.key]).map(f=>`<div>${safe(f.icon)} <b>${safe(f.label)}:</b> ${safe(values()[f.key])}</div>`).join('');
}
['personId','name','age'].forEach(id=>document.getElementById(id).addEventListener('input',preview));
document.getElementById('photo').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const u=URL.createObjectURL(f);document.getElementById('previewPhoto').src=u;
 document.getElementById('previewPhoto').classList.remove('hidden');document.getElementById('placeholder').classList.add('hidden');
});
async function upload(){
 const f=document.getElementById('photo').files[0];if(!f)return '';
 if(f.size>5*1024*1024)throw Error('รูปต้องไม่เกิน 5 MB');
 const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f);});
 const x=await apiPost({action:'upload',fileName:f.name,mimeType:f.type,base64:data});
 if(!x.ok)throw Error(x.error);return x.url;
}
async function saveCard(){
 try{
 status('กำลังบันทึก...');
 imageUrl=await upload();
 lastCard={personId:document.getElementById('personId').value.trim(),name:document.getElementById('name').value.trim(),age:document.getElementById('age').value,imageUrl,fields:values()};
 if(!lastCard.personId||!lastCard.name)throw Error('กรุณากรอกเลขประจำตัวและชื่อ');
 const r=await apiPost({action:'saveCard',card:lastCard});if(!r.ok)throw Error(r.error);
 lastId=r.id;status('บันทึกสำเร็จ เลขการ์ด: '+lastId);loadRecent();
 }catch(e){status(e.message);}
}
async function pushLine(){
 if(!lastId){status('กรุณาบันทึกการ์ดก่อน');return;}
 try{const r=await apiPost({action:'pushLine',id:lastId});status(r.ok?'ส่ง LINE สำเร็จ':r.error);}catch(e){status(e.message);}
}
function makeFlex(c){
 const rows=defs.filter(f=>c.fields&&c.fields[f.key]).map(f=>({type:'box',layout:'baseline',spacing:'sm',contents:[{type:'text',text:f.icon||'•',size:'sm',flex:0},{type:'text',text:(f.label+': '+c.fields[f.key]).slice(0,250),size:'sm',wrap:true,flex:1}]}));
 const bubble={type:'bubble',size:'giga',body:{type:'box',layout:'vertical',spacing:'sm',contents:[
 {type:'text',text:c.personId,weight:'bold',size:'lg',align:'center'},
 {type:'text',text:c.name+(c.age?' '+c.age+' ปี':''),weight:'bold',align:'center',wrap:true},...rows]}};
 if(c.imageUrl)bubble.hero={type:'image',url:c.imageUrl,size:'full',aspectRatio:'4:5',aspectMode:'cover'};
 return {type:'flex',altText:'การ์ดข้อมูล '+c.name,contents:bubble};
}
async function shareLine(){
 if(!lastId){status('กรุณาบันทึกการ์ดก่อน');return;}
 try{
 if(!LIFF_ID||LIFF_ID.includes('วาง_'))throw Error('กรุณาตั้ง LIFF_ID ใน HTML ก่อน');
 await liff.init({liffId:LIFF_ID});
 if(!liff.isInClient())throw Error('กรุณาเปิดเว็บผ่าน LINE LIFF');
 const r=await apiGet('getCard',{id:lastId});if(!r.ok)throw Error(r.error);
 const result=await liff.shareTargetPicker([makeFlex(r.card)]);
 status(result?'แชร์สำเร็จ':'ยกเลิกการแชร์');
 }catch(e){status(e.message);}
}
async function loadRecent(){
 const r=await apiGet('listCards');document.getElementById('recent').innerHTML=(r.cards||[]).map(c=>`<div class="border-b py-2">${safe(c.name)} · ${safe(c.personId)}</div>`).join('')||'ยังไม่มีข้อมูล';
}
function status(t){document.getElementById('status').textContent=t;}
function showAdmin(){document.getElementById('adminPanel').classList.remove('hidden');drawAdmin();}
function hideAdmin(){document.getElementById('adminPanel').classList.add('hidden');}
function drawAdmin(){document.getElementById('fieldList').innerHTML=defs.map((f,i)=>`<div class="border rounded p-2 flex justify-between"><span>${safe(f.icon)} ${safe(f.label)} (${safe(f.type)})</span><button onclick="removeField(${i})" class="text-red-600">ลบ</button></div>`).join('');}
function removeField(i){defs.splice(i,1);drawAdmin();}
function addField(){
 const label=document.getElementById('newLabel').value.trim();if(!label)return;
 defs.push({key:'f_'+Date.now(),label,icon:document.getElementById('newIcon').value,type:document.getElementById('newType').value});
 document.getElementById('newLabel').value='';document.getElementById('newIcon').value='';drawAdmin();drawFields();
}
async function saveFields(){
 try{const r=await apiPost({action:'adminFields',password:document.getElementById('adminPassword').value,fields:defs});
 document.getElementById('adminStatus').textContent=r.ok?'บันทึกฟิลด์แล้ว':r.error;drawFields();}
 catch(e){document.getElementById('adminStatus').textContent=e.message;}
}
async function saveSettings(){
 try{const r=await apiPost({action:'adminSettings',password:document.getElementById('adminPassword').value,target:document.getElementById('target').value,liff:document.getElementById('liff').value});
 document.getElementById('adminStatus').textContent=r.ok?'บันทึกแล้ว':r.error;}
 catch(e){document.getElementById('adminStatus').textContent=e.message;}
}
init();
</script>
</body></html>
